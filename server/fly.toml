# Fly.io config for the Spark meeting bot server.
# Rename "app" to something unique before deploying (or let `fly launch` set it).

app = "spark-bot"
primary_region = "iad"   # change to a region near you: https://fly.io/docs/reference/regions/

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false   # keep the bot reachable so it can join calls on demand
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      method = "GET"
      path = "/health"
      interval = "30s"
      timeout = "5s"
      grace_period = "20s"

[[vm]]
  # Chrome + a meeting need real memory. 1GB is the safe minimum.
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  # Persist recordings across restarts.
  source = "recordings"
  destination = "/app/recordings"
