      <stop stop-color="#1a7a43"/>
      <stop offset="1" stop-color="#0f5132"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- yard lines -->
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="2">
    <line x1="8" y1="16" x2="56" y2="16"/>
    <line x1="8" y1="48" x2="56" y2="48"/>
