<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F0D0B">
<meta name="color-scheme" content="dark">
<title>Shop Dashboard</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root{
    color-scheme: dark;
    --ink:#F3EDE2; --ink-soft:#A79B8B; --paper:#12100D; --card:#1D1915;
    --line:#2B2620; --bird:#2F5D8A; --bird-deep:#1B3A5C; --bird-tint:rgba(74,124,180,.16);
    --accent-text:#9CC0E8;
    --star:#E8B45C; --star-tint:rgba(232,180,92,.14); --good:#63BD87; --good-tint:rgba(99,189,135,.16);
    --bad:#E67E5A; --radius:14px;
  }
  *{ box-sizing:border-box; margin:0; }
  body{ background:var(--paper); color:var(--ink); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height:100vh; }
  .serif{ font-family:"Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif; }
  button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  input{ font:inherit; }
  button:focus-visible, input:focus-visible{ outline:3px solid var(--bird); outline-offset:2px; border-radius:6px; }
  .money{ font-variant-numeric:tabular-nums; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 26px -20px rgba(0,0,0,.7); }

  /* login */
  .login{ max-width:360px; margin:18vh auto 0; padding:0 20px; text-align:center; }
  .login .logo{ width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,#24486F,#152C46); box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 12px 24px -10px rgba(0,0,0,.7); display:inline-grid; place-items:center; }
  .login h1{ font-size:24px; margin-top:14px; }
  .login p{ color:var(--ink-soft); font-size:14px; margin-top:4px; }
  .login input{ width:100%; margin-top:18px; padding:14px; font-size:22px; text-align:center; letter-spacing:.4em; border:1.5px solid var(--line); border-radius:12px; background:var(--card); }
  .login .btn{ margin-top:12px; }
  .btn{ display:block; width:100%; text-align:center; background:var(--bird); color:#fff; font-weight:700; padding:14px; border-radius:999px; font-size:16px; }
  .err{ color:var(--bad); font-weight:600; font-size:14px; margin-top:10px; }

  /* shell */
  header.top{ display:flex; align-items:center; gap:12px; padding:14px 20px;
    background:rgba(18,15,13,.84); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header.top .logo{ width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#24486F,#152C46); box-shadow:inset 0 1px 0 rgba(255,255,255,.14); display:grid; place-items:center; }
  header.top .t{ font-weight:700; font-size:17px; }
  header.top .sub{ font-size:12px; color:var(--ink-soft); }
  .tabs{ margin-left:auto; display:flex; gap:6px; }
  .tabs button{ padding:9px 16px; border-radius:999px; font-weight:700; font-size:14px; color:var(--ink-soft); position:relative; }
  .tabs button.on{ background:var(--bird-tint); color:var(--accent-text); }
  .tabs .cnt{ position:absolute; top:-2px; right:-2px; background:var(--bad); color:#fff; font-size:10.5px; font-weight:800; min-width:17px; height:17px; border-radius:9px; display:grid; place-items:center; padding:0 4px; }
  main{ max-width:1080px; margin:0 auto; padding:20px; }

  /* orders board */
  .board{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); align-items:start; }
  .order{ padding:16px; border-left:6px solid var(--bird); }
  .order.s1{ border-left-color:var(--star); }
  .order.s2{ border-left-color:var(--good); }
  .order.s3{ border-left-color:var(--line); opacity:.65; }
  .o-head{ display:flex; align-items:baseline; gap:10px; }
  .o-num{ font-size:22px; font-weight:800; }
  .o-name{ font-weight:700; font-size:16px; }
  .o-when{ margin-left:auto; font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .o-pickup{ display:inline-block; margin-top:6px; font-size:12.5px; font-weight:700; background:var(--bird-tint); color:var(--accent-text); border-radius:6px; padding:2px 8px; }
  .o-items{ margin-top:10px; }
  .o-item{ padding:7px 0; border-top:1px dashed var(--line); font-size:15.5px; }
  .o-item .q{ font-weight:800; }
  .o-item .mods{ display:block; font-size:13px; color:var(--ink-soft); }
  .o-item .freebie{ color:var(--star); font-weight:700; font-size:12.5px; }
  .o-total{ margin-top:8px; font-size:14px; color:var(--ink-soft); display:flex; justify-content:space-between; }
  .o-actions{ margin-top:12px; display:flex; gap:8px; }
  .o-actions .act{ flex:1; padding:13px; border-radius:12px; font-weight:800; font-size:15px; background:var(--bird); color:#fff; }
  .o-actions .act.ready{ background:var(--good); }
  .o-actions .act.done{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); flex:0 0 auto; padding:13px 16px; }
  .o-actions .act{ box-shadow:0 8px 18px -8px rgba(0,0,0,.5); }
  .save{ box-shadow:0 6px 14px -6px rgba(0,0,0,.45); }
  .empty{ text-align:center; color:var(--ink-soft); padding:70px 20px; grid-column:1/-1; }
  .empty .big{ font-size:44px; }

  /* menu editor */
  .m-row{ display:flex; align-items:center; gap:12px; padding:12px 16px; }
  .m-row + .m-row{ border-top:1px solid var(--line); }
  .m-row .ic-img{ width:38px; height:38px; border-radius:10px; object-fit:cover; background:var(--line); }
  .m-row .n{ font-weight:700; }
  .m-row .c{ font-size:12px; color:var(--ink-soft); }
  .m-row input.price{ width:84px; padding:8px 10px; border:1.5px solid var(--line); border-radius:10px; text-align:right; font-variant-numeric:tabular-nums; margin-left:auto; background:var(--card); }
  .m-row .avail{ flex:none; width:110px; padding:9px 0; border-radius:999px; font-weight:700; font-size:13.5px; }
  .m-row .avail.yes{ background:var(--good-tint); color:var(--good); }
  .m-row .avail.no{ background:rgba(230,126,90,.16); color:var(--bad); }

  /* settings */
  .set-card{ padding:18px; max-width:640px; }
  .set-card h3{ font-size:17px; }
  .set-card .hint{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .set-row{ display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .set-row label{ font-weight:700; font-size:14px; }
  .set-row input{ padding:9px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--card); }
  .set-row input.num{ width:74px; text-align:right; }
  .set-row input.wide{ flex:1; min-width:160px; }
  .save{ margin-top:16px; background:var(--bird); color:#fff; font-weight:700; padding:11px 22px; border-radius:999px; }
  .saved-note{ color:var(--good); font-weight:700; font-size:14px; margin-left:10px; }

  /* customers */
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); padding:10px 16px; border-bottom:1px solid var(--line); }
  td{ padding:11px 16px; border-bottom:1px solid var(--line); font-size:15px; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  th.num{ text-align:right; }
  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#17130F; padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; z-index:30; box-shadow:0 10px 28px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const fmt = n => '$' + (+n).toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M2.8 16.2c2.6 1.9 6 2.8 9.2 2.3 4-.6 6.8-3 7.6-6.2l2.1-.9-2-.7c-.4-1.9-1.9-3.2-4-3.4.9 1 1.3 2.2 1.2 3.5-1.6-2.6-4.6-4-8-3.3 1.6.7 2.8 1.9 3.4 3.5-2.7-1.5-6.2-1.2-9.5.9 1.9-.1 3.6.4 4.9 1.4-1.8.5-3.5 1.5-4.9 2.9Z" fill="#F6F1E8"/></svg>';

let PIN = sessionStorage.getItem('staff-pin') || '';
let view = 'orders';
let orders = [], menu = [], customers = [], settings = null;
let instore = { phone: '', cust: null, log: [], error: '' };
let sqs = null; // Square integration status
let lastSeen = Date.now();
let shopName = 'Shop Dashboard';

async function api(path, body){
  const res = await fetch('/api' + path, {
    method: body ? 'POST' : 'GET',
    headers: Object.assign({ 'x-staff-pin': PIN }, body ? { 'Content-Type':'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(()=>({}));
  if (res.status === 401){ PIN=''; sessionStorage.removeItem('staff-pin'); renderLogin(data.error); throw new Error('auth'); }
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

/* ---------- sound ---------- */
let audioCtx = null;
function chime(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [880, 1174.66].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, now + i*0.18);
      g.gain.exponentialRampToValueAtTime(0.22, now + i*0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.18 + 0.5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now + i*0.18); o.stop(now + i*0.18 + 0.55);
    });
  } catch(e){}
}

/* ---------- login ---------- */
function renderLogin(err){
  document.title = 'Shop Dashboard';
  $('#root').innerHTML = `
    <div class="login">
      <div class="logo">${LOGO}</div>
      <h1 class="serif">Shop Dashboard</h1>
      <p>Enter the staff PIN to see orders.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
      ${err ? '<div class="err">'+esc(err)+'</div>' : ''}
      <button class="btn" id="loginBtn">Open dashboard</button>
    </div>`;
  const go = async () => {
    PIN = $('#pin').value.trim();
    try { await api('/staff/login', { pin: PIN }); sessionStorage.setItem('staff-pin', PIN); boot(); }
    catch(e){ if (e.message !== 'auth') renderLogin(e.message); }
  };
  $('#loginBtn').addEventListener('click', go);
  $('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#pin').focus();
}

/* ---------- shell ---------- */
function renderShell(){
  const active = orders.filter(o => o.status < 2).length;
  $('#root').innerHTML = `
    <header class="top">
      <div class="logo">${LOGO}</div>
      <div><div class="t">${esc(shopName)}</div><div class="sub">Order dashboard</div></div>
      <nav class="tabs">
        <button data-v="orders" class="${view==='orders'?'on':''}">Orders ${active?'<span class="cnt">'+active+'</span>':''}</button>
        <button data-v="instore" class="${view==='instore'?'on':''}">In-store</button>
        <button data-v="menu" class="${view==='menu'?'on':''}">Menu</button>
        <button data-v="rewards" class="${view==='rewards'?'on':''}">Rewards</button>
        <button data-v="customers" class="${view==='customers'?'on':''}">Customers</button>
      </nav>
    </header>
    <main id="main"></main>`;
  document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', async () => {
    view = b.dataset.v;
    if (view==='menu') menu = await api('/staff/menu');
    if (view==='customers') customers = await api('/staff/customers');
    if (view==='rewards'){ settings = await api('/staff/settings'); sqs = await api('/staff/square/status'); }
    if (view==='instore') instore.log = await api('/staff/instore/log');
    renderShell();
  }));
  ({ orders: renderOrders, instore: renderInstore, menu: renderMenu, rewards: renderRewards, customers: renderCustomers })[view]();
}

/* ---------- orders ---------- */
const STATUS_LABEL = ['NEW', 'PREPARING', 'READY', 'PICKED UP'];
function renderOrders(){
  const list = orders.filter(o => o.status < 3);
  const doneToday = orders.filter(o => o.status === 3);
  $('#main').innerHTML = `
    <div class="board">
      ${list.length ? list.map(orderCard).join('') : '<div class="empty"><p>No open orders.<br>New orders pop up here with a chime.</p></div>'}
    </div>
    ${doneToday.length ? '<h2 class="serif" style="margin:26px 2px 12px; font-size:19px;">Recently picked up</h2><div class="board">' + doneToday.slice(0,6).map(orderCard).join('') + '</div>' : ''}`;
  document.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', async () => {
    const [num, st] = b.dataset.st.split(':').map(Number);
    await api('/staff/orders/' + num + '/status', { status: st });
    const o = orders.find(o => o.num === num); if (o) o.status = st;
    renderShell();
  }));
}
function orderCard(o){
  const t = new Date(o.placedAt);
  const mins = Math.round((Date.now() - o.placedAt) / 60000);
  return `<div class="card order s${o.status}">
    <div class="o-head"><span class="o-num">#${o.num}</span><span class="o-name">${esc(o.name || '')}</span>
      <span class="o-when">${t.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})} · ${mins}m ago</span></div>
    <span class="o-pickup">${esc(o.pickup)}</span> <span class="o-pickup" style="background:${o.status===2?'var(--good-tint)':'var(--star-tint)'};color:${o.status===2?'var(--good)':'var(--star)'}">${STATUS_LABEL[o.status]}</span>
    <div class="o-items">
      ${o.lines.map(l => `<div class="o-item"><span class="q">${l.qty}×</span> ${esc(l.itemName || l.id)} ${l.redeem?'<span class="freebie">FREE (reward)</span>':''}
        ${l.modsText ? '<span class="mods">'+esc(l.modsText)+'</span>' : ''}</div>`).join('')}
    </div>
    <div class="o-total"><span>Paid ${fmt(o.total)} (tip ${fmt(o.tip)})</span><span>${esc(maskPhone(o.phone))}</span></div>
    <div class="o-actions">
      ${o.status===0 ? '<button class="act" data-st="'+o.num+':1">Start preparing</button>' : ''}
      ${o.status===1 ? '<button class="act ready" data-st="'+o.num+':2">Mark ready</button>' : ''}
      ${o.status===2 ? '<button class="act done" data-st="'+o.num+':3" style="flex:1">Picked up ✓</button>' : ''}
    </div>
  </div>`;
}
const maskPhone = p => p ? '(•••) •••-' + String(p).slice(-4) : '';

/* ---------- in-store earn & redeem ---------- */
function renderInstore(){
  const c = instore.cust;
  $('#main').innerHTML = `
    <div class="card set-card">
      <h3 class="serif">In-store rewards</h3>
      <p class="hint">Customer gives their phone number — same account as the app. A new number just needs a first name.</p>
      <div class="set-row">
        <input id="isPhone" class="wide" type="tel" inputmode="tel" placeholder="(555) 555-1234" value="${esc(instore.phone)}">
        <button class="save" id="isLookup">Look up</button>
      </div>
      ${instore.error ? '<p style="color:var(--bad);font-weight:700;margin-top:10px">'+esc(instore.error)+'</p>' : ''}
      ${c ? `
        <div class="set-row" style="margin-top:18px">
          ${c.known
            ? '<b style="font-size:18px">'+esc(c.name || '—')+'</b><span class="hint">member</span>'
            : '<input id="isName" class="wide" placeholder="First name (new member)">'}
          <span style="margin-left:auto;font-weight:800;color:var(--star);font-size:22px">${c.points}★</span>
        </div>
        <div class="set-row">
          <label for="isAmt" style="font-weight:700">Purchase $</label>
          <input id="isAmt" class="num" inputmode="decimal" placeholder="0.00">
          <button class="save" id="isEarn">Add stars</button>
        </div>
        <p class="hint" style="margin-top:12px">Redeem a reward in person:</p>
        <div class="set-row" style="flex-wrap:wrap">
          ${c.tiers.map((t,i)=>'<button class="save" data-isredeem="'+i+'" '+(t.canRedeem?'':'disabled')+' style="background:'+(t.canRedeem?'var(--good)':'var(--line)')+'; color:'+(t.canRedeem?'#fff':'var(--ink-soft)')+'">'+esc(t.name)+' · '+t.pts+'★</button>').join('')}
        </div>` : ''}
    </div>
    <div class="card set-card" style="margin-top:14px; max-width:760px">
      <h3 class="serif">Recent in-store activity</h3>
      <p class="hint">Every manual credit and redemption is logged here for the owner. Limit: 3 credits per number per day.</p>
      ${instore.log.length ? '<div style="overflow-x:auto"><table><thead><tr><th>When</th><th>Member</th><th class="num">Stars</th><th>Detail</th></tr></thead><tbody>'
        + instore.log.map(e => '<tr><td>'+new Date(e.ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</td><td><b>'+esc(e.name||'—')+'</b> '+maskPhone(e.phone)+'</td><td class="num" style="font-weight:700;color:'+(e.stars>=0?'var(--good)':'var(--star)')+'">'+(e.stars>=0?'+':'')+e.stars+'★</td><td>'+(e.type==='earn' ? '$'+(+e.amount).toFixed(2)+' purchase' : esc(e.item||'reward'))+'</td></tr>').join('')
        + '</tbody></table></div>' : ''}
    </div>`;
  $('#isLookup').addEventListener('click', isLookup);
  $('#isPhone').addEventListener('keydown', e => { if (e.key === 'Enter') isLookup(); });
  const earnBtn = $('#isEarn');
  if (earnBtn){
    earnBtn.addEventListener('click', isEarn);
    $('#isAmt').addEventListener('keydown', e => { if (e.key === 'Enter') isEarn(); });
  }
  document.querySelectorAll('[data-isredeem]').forEach(b => b.addEventListener('click', () => isRedeem(+b.dataset.isredeem)));
}
async function isLookup(){
  instore.phone = $('#isPhone').value; instore.error = '';
  try { instore.cust = await api('/staff/instore/lookup', { phone: instore.phone }); }
  catch(e){ if (e.message !== 'auth'){ instore.error = e.message; instore.cust = null; } }
  renderInstore();
}
async function isEarn(){
  instore.error = '';
  const nameEl = $('#isName');
  try {
    const r = await api('/staff/instore/earn', { phone: instore.phone, amount: parseFloat($('#isAmt').value), name: nameEl ? nameEl.value : '' });
    toastMsg((r.name || 'Member') + ' +' + r.stars + '★ — now ' + r.points + '★');
    instore.log = await api('/staff/instore/log');
    instore.cust = await api('/staff/instore/lookup', { phone: instore.phone });
  } catch(e){ if (e.message !== 'auth') instore.error = e.message; }
  renderInstore();
}
async function isRedeem(i){
  instore.error = '';
  try {
    const r = await api('/staff/instore/redeem', { phone: instore.phone, tier: i });
    toastMsg('Give ' + (r.name || 'member') + ': ' + r.reward + ' — ' + r.points + '★ left');
    instore.log = await api('/staff/instore/log');
    instore.cust = await api('/staff/instore/lookup', { phone: instore.phone });
  } catch(e){ if (e.message !== 'auth') instore.error = e.message; }
  renderInstore();
}

/* ---------- menu ---------- */
function renderMenu(){
  $('#main').innerHTML = `<div class="card">${menu.map(m => `
    <div class="m-row">
      <img class="ic-img" src="/img/menu/${m.id}" alt="" onerror="this.style.visibility='hidden'">
      <div><div class="n">${esc(m.name)}</div><div class="c">${esc(m.cat)}</div></div>
      <input class="price money" data-price="${m.id}" value="${m.price.toFixed(2)}" inputmode="decimal" aria-label="Price for ${esc(m.name)}">
      <button class="avail ${m.available?'yes':'no'}" data-avail="${m.id}">${m.available ? 'Available' : 'Sold out'}</button>
    </div>`).join('')}</div>
    <p style="margin-top:12px;font-size:13px;color:var(--ink-soft)">Tap a price to edit (saves when you click away). "Sold out" hides the item from customers instantly.</p>`;
  document.querySelectorAll('[data-avail]').forEach(b => b.addEventListener('click', async () => {
    const m = menu.find(x => x.id === b.dataset.avail);
    const upd = await api('/staff/menu/' + m.id, { available: !m.available });
    Object.assign(m, upd); renderShell(); toastMsg(upd.available ? m.name + ' is back on the menu' : m.name + ' marked sold out');
  }));
  document.querySelectorAll('[data-price]').forEach(inp => inp.addEventListener('change', async () => {
    const m = menu.find(x => x.id === inp.dataset.price);
    const upd = await api('/staff/menu/' + m.id, { price: parseFloat(inp.value) });
    Object.assign(m, upd); inp.value = upd.price.toFixed(2); toastMsg(m.name + ' → ' + fmt(upd.price));
  }));
}

/* ---------- rewards settings ---------- */
function renderRewards(){
  $('#main').innerHTML = `
    <div class="card set-card">
      <h3 class="serif">Earning</h3>
      <p class="hint">How many stars customers earn per dollar spent.</p>
      <div class="set-row"><label for="er">Stars per $1</label><input id="er" class="num" inputmode="decimal" value="${settings.earnRate}"></div>
    </div>
    <div class="card set-card" style="margin-top:14px">
      <h3 class="serif">Rewards</h3>
      <p class="hint">What stars unlock. "Free item" is what gets added to the customer's order.</p>
      ${settings.tiers.map((t,i) => `
        <div class="set-row">
          <input class="num" data-tf="pts:${i}" inputmode="numeric" value="${t.pts}" aria-label="Stars required">
          <input class="wide" data-tf="name:${i}" value="${esc(t.name)}" aria-label="Reward name">
          <input class="wide" data-tf="grants:${i}" value="${esc(t.grants)}" aria-label="Free item id" title="Menu item id (e.g. drip, croissant, latte)">
        </div>`).join('')}
      <button class="save" id="saveSet">Save rewards</button><span class="saved-note" id="savedNote"></span>
    </div>
    <div class="card set-card" style="margin-top:14px">
      <h3 class="serif">Gift cards</h3>
      <p class="hint">Sell digital gift cards in the customer app ($10 / $25 / $50). Customers buy a code and share it; balances apply at checkout.</p>
      <div class="set-row"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="gcEnabled" ${settings.giftCardsEnabled?'checked':''}> Sell gift cards</label></div>
    </div>
    <div class="card set-card" style="margin-top:14px">
      <h3 class="serif">Square integration <span style="font-size:11px;color:var(--ink-soft);letter-spacing:.08em">BETA</span></h3>
      ${!sqs || !sqs.connected ? `
        <p class="hint">Connect the shop's Square account: menu syncs from the register, app orders appear on the POS, and in-person sales earn stars automatically.</p>
        <div class="set-row"><input id="sqToken" class="wide" type="password" placeholder="Square access token (sandbox or production)"></div>
        <div class="set-row"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="sqProd"> Production account (unchecked = sandbox)</label></div>
        <button class="save" id="sqConnect">Connect Square</button><span class="saved-note" id="sqNote"></span>
      ` : `
        <p class="hint">Connected (${sqs.env}) · ${sqs.syncedItems ? sqs.syncedItems + ' menu items synced' : 'menu not synced yet'}${sqs.lastSync ? ' · last sync ' + new Date(sqs.lastSync).toLocaleString() : ''}</p>
        ${sqs.locations && sqs.locations.length > 1 ? '<div class="set-row"><label>Location</label><select id="sqLoc">'+sqs.locations.map(l=>'<option value="'+esc(l.id)+'" '+(l.id===sqs.locationId?'selected':'')+'>'+esc(l.name)+'</option>').join('')+'</select></div>' : ''}
        <div class="set-row"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="sqPush" ${sqs.pushOrders?'checked':''}> Send app orders to the Square register</label></div>
        <div class="set-row"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="sqStars" ${sqs.autoStars?'checked':''}> Auto-award stars for in-person Square sales</label></div>
        <div class="set-row"><input id="sqWebhook" class="wide" type="password" placeholder="${sqs.hasWebhookKey ? 'Webhook signature key (saved)' : 'Webhook signature key (for auto-stars)'}"></div>
        <div class="set-row">
          <button class="save" id="sqSave">Save</button>
          <button class="save" id="sqSync" style="background:var(--good)">Sync menu from Square</button>
          ${sqs.lastPush ? '<button class="save" id="sqVerify" style="background:var(--star)">Verify last push (#'+sqs.lastPush.num+')</button>' : ''}
          <button class="save" id="sqDisc" style="background:var(--bad)">Disconnect</button>
        </div>
        <div class="set-row"><span class="saved-note" id="sqNote" style="margin-left:0"></span></div>
      `}
    </div>
    ${settings.dataStore ? '<p class="hint" style="margin:12px 4px 0">Data store: boot #'+settings.dataStore.boots+' since '+new Date(settings.dataStore.firstBoot).toLocaleDateString()+(settings.dataStore.dataDirSet?'':' — ⚠ DATA_DIR not set; settings will not survive redeploys')+'. If this resets to boot #1 after a redeploy, the storage volume is not persisting — fix before launch.</p>' : ''}`;
  $('#saveSet').addEventListener('click', async () => {
    const tiers = settings.tiers.map((t,i) => ({
      pts: +document.querySelector('[data-tf="pts:'+i+'"]').value || t.pts,
      name: document.querySelector('[data-tf="name:'+i+'"]').value || t.name,
      desc: t.desc,
      grants: document.querySelector('[data-tf="grants:'+i+'"]').value || t.grants,
    }));
    await api('/staff/settings', { earnRate: parseFloat($('#er').value), tiers, giftCardsEnabled: $('#gcEnabled').checked });
    settings = await api('/staff/settings');
    $('#savedNote').textContent = 'Saved ✓';
    setTimeout(()=>{ const n=$('#savedNote'); if(n) n.textContent=''; }, 2500);
  });

  const sqNote = msg => { const n = $('#sqNote'); if (n) n.textContent = msg; };
  const sqRefresh = async () => { sqs = await api('/staff/square/status'); renderShell(); };
  const sqCall = async (body, okMsg) => {
    try { await api('/staff/square/connect', body); if (okMsg) toastMsg(okMsg); await sqRefresh(); }
    catch(e){ if (e.message !== 'auth') sqNote(e.message); }
  };
  if ($('#sqConnect')) $('#sqConnect').addEventListener('click', () => {
    sqNote('Connecting…');
    sqCall({ accessToken: $('#sqToken').value, env: $('#sqProd').checked ? 'production' : 'sandbox' }, 'Square connected');
  });
  if ($('#sqSave')) $('#sqSave').addEventListener('click', () => {
    const body = { pushOrders: $('#sqPush').checked, autoStars: $('#sqStars').checked };
    const loc = $('#sqLoc'); if (loc) body.locationId = loc.value;
    const wh = $('#sqWebhook'); if (wh && wh.value.trim()) body.webhookKey = wh.value.trim();
    sqCall(body, 'Square settings saved');
  });
  if ($('#sqSync')) $('#sqSync').addEventListener('click', async () => {
    sqNote('Syncing menu…');
    try { const r = await api('/staff/square/sync', {}); toastMsg(r.count + ' items synced from Square'); await sqRefresh(); }
    catch(e){ if (e.message !== 'auth') sqNote(e.message); }
  });
  if ($('#sqDisc')) $('#sqDisc').addEventListener('click', () => sqCall({ disconnect: true }, 'Square disconnected'));
  if ($('#sqVerify')) $('#sqVerify').addEventListener('click', async () => {
    sqNote('Asking Square…');
    try {
      const v = await api('/staff/square/verify', {});
      sqNote('Square confirms order #' + v.num + ' exists: state ' + v.state + ', total $' + (v.total != null ? v.total.toFixed(2) : '?') + ', ' + (v.paid ? 'PAID' : 'NOT PAID — this is why it may be hidden on the POS'));
    } catch(e){ if (e.message !== 'auth') sqNote(e.message); }
  });
}

/* ---------- customers ---------- */
function renderCustomers(){
  $('#main').innerHTML = customers.length ? `
    <div class="card" style="overflow-x:auto"><table>
      <thead><tr><th>Customer</th><th>Phone</th><th class="num">Stars</th><th class="num">Orders</th><th class="num">Total spend</th></tr></thead>
      <tbody>${customers.map(c => `<tr><td><b>${esc(c.name||'—')}</b></td><td>${esc(maskPhone(c.phone))}</td>
        <td class="num">${c.points}★</td><td class="num">${c.orders}</td><td class="num">${fmt(c.spend)}</td></tr>`).join('')}</tbody>
    </table></div>` :
    '<div class="empty"><p>No customers yet — they appear here after their first order.</p></div>';
}

/* ---------- toast ---------- */
let tt = null;
function toastMsg(m){
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const el = document.createElement('div'); el.className='toast'; el.textContent = m;
  document.body.appendChild(el);
  clearTimeout(tt); tt = setTimeout(()=>el.remove(), 2400);
}

/* ---------- polling ---------- */
async function poll(){
  if (!PIN) return;
  try {
    const data = await api('/staff/orders?since=' + lastSeen);
    const hadNew = data.orders.some(o => o.placedAt > lastSeen);
    orders = data.orders;
    if (data.newest) lastSeen = Math.max(lastSeen, data.newest);
    if (hadNew){ chime(); toastMsg('New order!'); }
    if (view === 'orders') renderShell();
  } catch(e){}
}
setInterval(poll, 3000);

async function boot(){
  try {
    const shop = await fetch('/api/shop').then(r=>r.json());
    shopName = shop.name; document.title = shop.name + ' — Dashboard';
  } catch(e){}
  const data = await api('/staff/orders?since=0');
  orders = data.orders; lastSeen = data.newest || Date.now();
  renderShell();
}

if (PIN) boot().catch(()=>renderLogin()); else renderLogin();
</script>
</body>
</html>
