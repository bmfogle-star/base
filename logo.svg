<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg)" rx="22"/>

  <!-- Spider web — 6 spokes, 3 hexagonal rings -->
  <g stroke="#d4d4d8" stroke-width="0.85" fill="none" opacity="0.8">
    <!-- Spokes from center (100,100) -->
    <line x1="100" y1="100" x2="176" y2="100"/>
    <line x1="100" y1="100" x2="138" y2="165.9"/>
    <line x1="100" y1="100" x2="62"  y2="165.9"/>
    <line x1="100" y1="100" x2="24"  y2="100"/>
    <line x1="100" y1="100" x2="62"  y2="34.1"/>
    <line x1="100" y1="100" x2="138" y2="34.1"/>

    <!-- Outer ring  r=76 -->
    <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1"/>
    <!-- Middle ring r=50 -->
    <polygon points="150,100 125,143.3 75,143.3 50,100 75,56.7 125,56.7"/>
    <!-- Inner ring  r=26 -->
    <polygon points="126,100 113,122.5 87,122.5 74,100 87,77.5 113,77.5"/>
  </g>

  <!-- Cursor — web design reference, tip near web center -->
  <g transform="translate(98, 86)" filter="url(#glow)">
    <!-- Dark outline gives the cursor depth -->
    <path d="M2,2 L2,22 L7,16.5 L10.5,25 L14.5,23.2 L11,14.8 L18.5,14.8 Z"
          fill="#0f172a"/>
    <!-- Blue fill, offset slightly so outline peeks through -->
    <path d="M2,2 L2,22 L7,16.5 L10.5,25 L14.5,23.2 L11,14.8 L18.5,14.8 Z"
          fill="#3b82f6" stroke="#93c5fd" stroke-width="0.6" stroke-linejoin="round"
          transform="translate(-1,-1)"/>
  </g>
</svg>
